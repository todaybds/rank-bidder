name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.11.16"

jobs:
  lint-and-test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync workspace
        run: uv sync --all-packages --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest — decision-engine
        # Story 1.3: naver_live + slow 마커는 CI에서 SKIP (실제 API 호출 + 광고비).
        run: uv run pytest decision-engine/tests -v -m "not naver_live and not slow"

      - name: Pytest — serp-measurer
        run: uv run pytest serp-measurer/tests -v

  sam-build:
    name: SAM build validate
    # Lambda Architectures: arm64 — use native arm64 runner (free for public repos)
    # to avoid QEMU emulation cost of `--use-container` on x86. Native python3.13
    # on arm64 host = same architecture as Lambda runtime → parity preserved.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM validate
        working-directory: serp-measurer
        run: sam validate --lint

      - name: SAM build
        working-directory: serp-measurer
        run: sam build
