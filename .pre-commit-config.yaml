# Architecture step-05 §Enforcement — ruff (lint + format) + sqlfluff (SQL only).
# 추가 도구 금지 (NFR-8 단순성).
#
# 로컬 설치: `pre-commit install` 1회 실행하면 git commit 시 자동 hook 발동.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.2.5
    hooks:
      - id: sqlfluff-lint
        files: \.sql$
      - id: sqlfluff-fix
        files: \.sql$

  # NFR-8 단순성 — detect-private-key 하나만 유지 (NFR-7 secret 누설 방지 정당화).
  # trailing-whitespace/end-of-file-fixer는 ruff-format이 중복 처리.
  # check-yaml/check-toml은 sam validate + pyproject 파싱이 사실상 검증.
  # check-merge-conflict는 git이 막음.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
