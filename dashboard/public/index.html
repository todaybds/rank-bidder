<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Rank Bidder Dashboard</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/static/css/policies.css" />
  </head>
  <body>
    <div id="chat-banner" class="warning" hidden></div>
    <header>
      <h1>Rank Bidder</h1>
      <p class="muted">
        업데이트: <span id="generated-at">—</span>
        <button id="btn-refresh" type="button" class="link-button">즉시 새로고침</button>
      </p>
      <nav>
        <a href="/system.html">시스템 통제</a> · <a href="/policies.html">정책 편집</a>
      </nav>
      <div class="actions" style="margin-top: 1rem;">
        <button id="btn-import" type="button">키워드 import</button>
      </div>
    </header>
    <main id="app" class="dashboard-grid">
      <section class="widget" id="widget-hit-rate">
        <h2>24h 적중률</h2>
        <div class="widget-body"><p class="muted">로딩 중…</p></div>
      </section>
      <section class="widget" id="widget-serp">
        <h2>현재 SERP vs 목표</h2>
        <div class="widget-body"><p class="muted">로딩 중…</p></div>
      </section>
      <section class="widget" id="widget-failures">
        <h2>시스템 장애 (24h)</h2>
        <div class="widget-body"><p class="muted">로딩 중…</p></div>
      </section>
      <section class="widget" id="widget-movers">
        <h2>변동 Top 5</h2>
        <div class="widget-body"><p class="muted">로딩 중…</p></div>
      </section>
      <section class="widget" id="widget-spend">
        <h2>광고비 누적</h2>
        <div class="widget-body"><p class="muted">로딩 중…</p></div>
      </section>
    </main>

    <dialog id="import-modal">
      <form method="dialog">
        <h3>키워드 일괄 등록</h3>
        <p class="muted">Story 2.1 — Naver 캠페인 ID로 모든 KW 가져옴.</p>
        <label>
          site_id:
          <input id="import-site-id" type="text" required />
        </label>
        <label>
          campaign_id:
          <input id="import-campaign-id" type="text" required />
        </label>
        <label>
          target_rank (1~10):
          <input id="import-target" type="number" min="1" max="10" value="2" required />
        </label>
        <label>
          bid_cap (₩):
          <input id="import-bid-cap" type="number" min="100" max="100000" step="100" value="5000" required />
        </label>
        <div class="actions">
          <button id="import-submit" type="button">등록</button>
          <button value="cancel" type="submit">취소</button>
        </div>
        <p id="import-result" class="muted"></p>
      </form>
    </dialog>

    <script src="/static/js/env.js"></script>
    <script type="module" src="/static/js/main.js"></script>
    <script type="module" src="/static/js/dashboard.js"></script>
  </body>
</html>
